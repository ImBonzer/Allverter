<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allverter | Convert anything, simply</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/styles.css">
</head>
<body class="min-h-screen font-sans">
  <main class="grid-paper min-h-screen px-5 py-6 sm:px-8 lg:px-14">
    <nav class="mx-auto flex max-w-7xl items-center justify-between border-b border-[#30302e] pb-5">
      <a href="./index.html" class="font-display text-xl font-bold tracking-tight text-[#f5f1e8]">all<span class="text-[#ff7043]">verter</span><span class="text-[#ff7043]">.</span></a>
      <div class="flex items-center gap-2"><a href="./media.html" data-i18n="mediaLink" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b] transition hover:border-[#ff7043] hover:text-[#ff9a78]">Audio / video</a><button id="language-toggle" type="button" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b]">ES</button><button id="theme-toggle" type="button" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b]">Light mode</button></div>
    </nav>
    <section class="mx-auto max-w-7xl pb-16 pt-14 sm:pt-20">
      <div class="grid gap-10 lg:grid-cols-[.7fr_1.3fr] lg:items-center">
        <div class="rise-in">
          <h1 class="font-display text-5xl font-bold leading-[.94] tracking-tight text-[#f5f1e8] sm:text-7xl"><span data-i18n="convert">Convert</span><br><span class="text-[#ff7043]" data-i18n="images">images.</span></h1>
          <p class="mt-6 max-w-sm text-base leading-7 text-[#aaa59b]" data-i18n="imageIntro">Choose a file, pick a format, and download the result.</p>
        </div>
        <form id="converter-form" class="rise-in rounded-[1.25rem] border border-[#30302e] bg-[#151515] p-3 shadow-[0_22px_70px_rgba(0,0,0,.3)]" style="animation-delay: .1s">
          <div id="dropzone" class="dropzone rounded-[.9rem] border-2 border-dashed border-[#45433f] px-5 py-12 text-center sm:px-10">
            <input id="file-input" type="file" class="hidden" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.tif,.tiff,.ico,.ppm,.pgm,.pbm,.tga,.jp2,.j2k,.jpf,.avif,.qoi,.dds" aria-label="Choose files">
            <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#2b1b16] text-2xl font-bold text-[#ff7043]">+</div>
            <h2 class="font-display text-2xl font-semibold text-[#f5f1e8]" data-i18n="bringImage">Bring something in.</h2>
            <p class="mt-2 text-[#aaa59b]"><span data-i18n="dropImages">Drop images here or</span> <button id="browse-button" type="button" class="font-bold text-[#ff7043] underline decoration-2 underline-offset-4" data-i18n="browse">browse your device</button></p>
            <p class="mt-4 text-[.68rem] text-[#77736c]" data-i18n="imageFormats">PNG, JPG, WEBP, TIFF, and more</p>
            <div id="file-summary" class="mx-auto mt-7 hidden max-w-lg items-center justify-between gap-4 rounded-xl border border-[#383633] bg-[#1d1d1b] px-4 py-3 text-left">
              <img id="preview-image" class="preview-image hidden" alt="Selected image preview">
              <div class="min-w-0 flex-1"><p id="file-name" class="truncate font-semibold text-[#f5f1e8]"></p><p id="file-size" class="mt-1 text-xs text-[#aaa59b]"></p></div>
              <button id="clear-button" type="button" class="shrink-0 rounded-md px-2 py-1 text-sm font-bold text-[#aaa59b] hover:text-[#ff7043]" aria-label="Remove selected file">Clear</button>
            </div>
          </div>
          <div id="options" class="mt-3 hidden items-end gap-4 rounded-xl border border-[#30302e] bg-[#111111] p-4 sm:flex-row">
            <fieldset class="min-w-0 flex-1 text-left"><legend class="text-[.68rem] font-bold uppercase tracking-[.16em] text-[#aaa59b]" data-i18n="outputFormat">Output format</legend><div id="format-options" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5" role="radiogroup" aria-label="Output format"></div></fieldset>
            <button id="convert-button" type="submit" class="rounded-lg bg-[#ff7043] px-6 py-3 font-bold text-[#190d09] transition hover:bg-[#ff9a78] disabled:cursor-not-allowed disabled:opacity-50" data-i18n="convertFiles">Convert files</button>
          </div>
          <p id="status" class="px-3 pb-1 pt-3 text-sm text-[#aaa59b]" role="status" aria-live="polite">Choose a file to begin.</p>
        </form>
      </div>
    </section>
    <footer class="mx-auto max-w-7xl border-t border-[#30302e] pt-5 text-xs text-[#77736c]"><span>Files are processed locally.</span></footer>
  </main>
  <script src="./static/js/image.js"></script>
</body>
</html>
