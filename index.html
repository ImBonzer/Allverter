<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allverter | Convert anything, simply</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #f5f1e8; --muted: #aaa59b; --panel: #151515; --line: #30302e; --accent: #ff7043; --accent-soft: #2b1b16; }
    * { box-sizing: border-box; }
    body { background: #0c0c0c; color: var(--ink); }
    .grid-paper { background: radial-gradient(circle at 78% 12%, rgba(255, 112, 67, .12), transparent 24rem), linear-gradient(135deg, #0c0c0c 0%, #111312 55%, #0c0c0c 100%); }
    .dropzone { transition: border-color .2s, background .2s, transform .2s, box-shadow .2s; }
    .dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); box-shadow: 0 18px 50px rgba(255, 112, 67, .1); }
    .dropzone:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 112, 67, .18); }
    .format-button.selected { border-color: var(--accent); background: var(--accent-soft); color: #ff9a78; }
    .format-button:focus-visible { outline: 3px solid rgba(255, 112, 67, .36); outline-offset: 2px; }
    .format-button { display: flex; min-height: 58px; align-items: center; justify-content: flex-start; gap: .65rem; }
    .format-icon { display: inline-flex; min-width: 2.6rem; height: 2rem; align-items: center; justify-content: center; border: 1px solid #45433f; border-radius: .45rem; background: #252523; color: #c9c2b6; font-size: .58rem; font-weight: 800; letter-spacing: .04em; }
    .format-button.selected .format-icon { border-color: var(--accent); background: var(--accent); color: #160c08; }
    .preview-image { max-height: 8rem; max-width: 10rem; border-radius: .55rem; object-fit: cover; }
    .light-mode { background: #f4f0e8; color: #171717; }
    .light-mode .grid-paper { background: radial-gradient(circle at 78% 12%, rgba(255, 112, 67, .12), transparent 24rem), #f4f0e8; }
    .light-mode .border-\[\#30302e\] { border-color: #d4cec3 !important; }
    .light-mode form { background: #fffdf8; border-color: #d4cec3; }
    .light-mode .dropzone { border-color: #b9b0a2; }
    .light-mode .bg-\[\#151515\] { background: #fffdf8; }
    .light-mode .bg-\[\#111111\] { background: #f1ece3; }
    .light-mode .bg-\[\#1d1d1b\] { background: #ece7dd; }
    .light-mode .text-\[\#f5f1e8\] { color: #171717 !important; }
    .light-mode .text-\[\#aaa59b\] { color: #68635b !important; }
    .light-mode .text-\[\#77736c\] { color: #817a70 !important; }
    .light-mode .format-button { background: #fffdf8; border-color: #d4cec3; color: #3c3934; }
    .rise-in { animation: rise-in .65s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body class="min-h-screen font-sans">
  <main class="grid-paper min-h-screen px-5 py-6 sm:px-8 lg:px-14">
    <nav class="mx-auto flex max-w-7xl items-center justify-between border-b border-[#30302e] pb-5">
      <a href="./index.html" class="font-display text-xl font-bold tracking-tight text-[#f5f1e8]">all<span class="text-[#ff7043]">verter</span><span class="text-[#ff7043]">.</span></a>
      <div class="flex items-center gap-2"><a href="./media.html" data-i18n="mediaLink" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b] transition hover:border-[#ff7043] hover:text-[#ff9a78]">Audio / video</a><button id="language-toggle" type="button" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b]">ES</button><button id="theme-toggle" type="button" class="rounded-full border border-[#45433f] px-3 py-2 text-xs font-bold uppercase tracking-[.1em] text-[#aaa59b]">Light mode</button></div>
    </nav>
    <section class="mx-auto max-w-7xl pb-16 pt-14 sm:pt-20">
      <div class="grid gap-10 lg:grid-cols-[.7fr_1.3fr] lg:items-center">
        <div class="rise-in">
          <h1 class="font-display text-5xl font-bold leading-[.94] tracking-tight text-[#f5f1e8] sm:text-7xl"><span data-i18n="convert">Convert</span><br><span class="text-[#ff7043]" data-i18n="images">images.</span></h1>
          <p class="mt-6 max-w-sm text-base leading-7 text-[#aaa59b]" data-i18n="imageIntro">Choose a file, pick a format, and download the result.</p>
        </div>
        <form id="converter-form" class="rise-in rounded-[1.25rem] border border-[#30302e] bg-[#151515] p-3 shadow-[0_22px_70px_rgba(0,0,0,.3)]" style="animation-delay: .1s">
          <div id="dropzone" class="dropzone rounded-[.9rem] border-2 border-dashed border-[#45433f] px-5 py-12 text-center sm:px-10">
            <input id="file-input" type="file" class="hidden" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.tif,.tiff,.ico,.ppm,.pgm,.pbm,.tga,.jp2,.j2k,.jpf,.avif,.qoi,.dds" aria-label="Choose files">
            <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#2b1b16] text-2xl font-bold text-[#ff7043]">+</div>
            <h2 class="font-display text-2xl font-semibold text-[#f5f1e8]" data-i18n="bringImage">Bring something in.</h2>
            <p class="mt-2 text-[#aaa59b]"><span data-i18n="dropImages">Drop images here or</span> <button id="browse-button" type="button" class="font-bold text-[#ff7043] underline decoration-2 underline-offset-4" data-i18n="browse">browse your device</button></p>
            <p class="mt-4 text-[.68rem] text-[#77736c]" data-i18n="imageFormats">PNG, JPG, WEBP, TIFF, and more</p>
            <div id="file-summary" class="mx-auto mt-7 hidden max-w-lg items-center justify-between gap-4 rounded-xl border border-[#383633] bg-[#1d1d1b] px-4 py-3 text-left">
              <img id="preview-image" class="preview-image hidden" alt="Selected image preview">
              <div class="min-w-0 flex-1"><p id="file-name" class="truncate font-semibold text-[#f5f1e8]"></p><p id="file-size" class="mt-1 text-xs text-[#aaa59b]"></p></div>
              <button id="clear-button" type="button" class="shrink-0 rounded-md px-2 py-1 text-sm font-bold text-[#aaa59b] hover:text-[#ff7043]" aria-label="Remove selected file">Clear</button>
            </div>
          </div>
          <div id="options" class="mt-3 hidden items-end gap-4 rounded-xl border border-[#30302e] bg-[#111111] p-4 sm:flex-row">
            <fieldset class="min-w-0 flex-1 text-left"><legend class="text-[.68rem] font-bold uppercase tracking-[.16em] text-[#aaa59b]" data-i18n="outputFormat">Output format</legend><div id="format-options" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5" role="radiogroup" aria-label="Output format"></div></fieldset>
            <button id="convert-button" type="submit" class="rounded-lg bg-[#ff7043] px-6 py-3 font-bold text-[#190d09] transition hover:bg-[#ff9a78] disabled:cursor-not-allowed disabled:opacity-50" data-i18n="convertFiles">Convert files</button>
          </div>
          <p id="status" class="px-3 pb-1 pt-3 text-sm text-[#aaa59b]" role="status" aria-live="polite">Choose a file to begin.</p>
        </form>
      </div>
    </section>
    <footer class="mx-auto max-w-7xl border-t border-[#30302e] pt-5 text-xs text-[#77736c]"><span>Files are processed locally.</span></footer>
  </main>
  <script>
    const localHosts = ['localhost', '127.0.0.1'];
    const API_URL = localHosts.includes(window.location.hostname) ? '' : 'https://allverter-api-j6lv.onrender.com';
    const input = document.querySelector('#file-input');
    const dropzone = document.querySelector('#dropzone');
    const options = document.querySelector('#options');
    const formatOptions = document.querySelector('#format-options');
    const status = document.querySelector('#status');
    const fileSummary = document.querySelector('#file-summary');
    const fileName = document.querySelector('#file-name');
    const fileSize = document.querySelector('#file-size');
    const previewImage = document.querySelector('#preview-image');
    const convertButton = document.querySelector('#convert-button');
    const themeToggle = document.querySelector('#theme-toggle');
    const languageToggle = document.querySelector('#language-toggle');
    const MAX_FILE_SIZE = 100 * 1024 * 1024;
    let selectedFiles = [];
    let selectedTarget = '';
    const translations = { en: { mediaLink: 'Audio / video', convert: 'Convert', images: 'images.', imageIntro: 'Choose a file, pick a format, and download the result.', bringImage: 'Bring something in.', dropImages: 'Drop images here or', browse: 'browse your device', imageFormats: 'PNG, JPG, WEBP, TIFF, and more', outputFormat: 'Output format', convertFiles: 'Convert files', chooseFile: 'Choose a file to begin.', checking: 'Checking compatible formats...', ready: 'file(s) ready.', unsupported: 'No shared output format is available for these files.', converting: 'Converting', done: 'Done. Your download should start automatically.' }, es: { mediaLink: 'Audio / video', convert: 'Convierte', images: 'imágenes.', imageIntro: 'Elige un archivo, selecciona un formato y descarga el resultado.', bringImage: 'Añade un archivo.', dropImages: 'Arrastra imágenes aquí o', browse: 'explora tu dispositivo', imageFormats: 'PNG, JPG, WEBP, TIFF y más', outputFormat: 'Formato de salida', convertFiles: 'Convertir archivos', chooseFile: 'Elige un archivo para comenzar.', checking: 'Comprobando formatos compatibles...', ready: 'archivo(s) listos.', unsupported: 'No hay un formato de salida común para estos archivos.', converting: 'Convirtiendo', done: 'Listo. La descarga comenzará automáticamente.' } };
    let language = localStorage.getItem('allverter-language') || 'en';

    function applyLanguage() {
      document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = translations[language][element.dataset.i18n]; });
      languageToggle.textContent = language === 'en' ? 'ES' : 'EN';
      document.documentElement.lang = language;
    }
    languageToggle.addEventListener('click', () => { language = language === 'en' ? 'es' : 'en'; localStorage.setItem('allverter-language', language); applyLanguage(); });
    applyLanguage();

    document.querySelector('#browse-button').addEventListener('click', () => input.click());
    dropzone.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); input.click(); }
    });
    input.addEventListener('change', () => input.files.length && selectFiles([...input.files]));
    ['dragenter', 'dragover'].forEach(event => dropzone.addEventListener(event, event => { event.preventDefault(); dropzone.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach(event => dropzone.addEventListener(event, event => { event.preventDefault(); dropzone.classList.remove('dragging'); }));
    dropzone.addEventListener('drop', event => event.dataTransfer.files.length && selectFiles([...event.dataTransfer.files]));
    document.querySelector('#clear-button').addEventListener('click', resetForm);
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const light = document.body.classList.contains('light-mode');
      localStorage.setItem('allverter-theme', light ? 'light' : 'dark');
      themeToggle.textContent = light ? 'Dark mode' : 'Light mode';
    });
    if (localStorage.getItem('allverter-theme') === 'light') themeToggle.click();

    async function selectFiles(files) {
      selectedFiles = files;
      const totalSize = files.reduce((total, file) => total + file.size, 0);
      fileName.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
      fileSize.textContent = `${(totalSize / 1024 / 1024).toFixed(2)} MB total`;
      fileSummary.classList.remove('hidden'); fileSummary.classList.add('flex');
      if (files.length === 1 && files[0].type.startsWith('image/')) {
        previewImage.src = URL.createObjectURL(files[0]);
        previewImage.classList.remove('hidden');
      } else {
        previewImage.removeAttribute('src'); previewImage.classList.add('hidden');
      }
      options.classList.add('hidden'); options.classList.remove('flex');
      if (files.some(file => file.size > MAX_FILE_SIZE)) {
        status.textContent = 'Each file must be smaller than 100 MB.';
        selectedFiles = [];
        return;
      }
      status.textContent = translations[language].checking;
      try {
        const formatResponses = await Promise.all(files.map(file => fetch(`${API_URL}/api/formats?filename=${encodeURIComponent(file.name)}`).then(response => response.json())));
        const targets = formatResponses.slice(1).reduce((common, data) => common.filter(target => data.targets.includes(target)), formatResponses[0]?.targets || []);
        selectedTarget = targets[0] || '';
        formatOptions.innerHTML = targets.map((target, index) => `<button type="button" class="format-button rounded-lg border border-[#b9cbb7] bg-white px-3 py-2 text-sm font-bold text-[#526b5c] transition hover:border-[#e75c35] hover:text-[#c94824] ${index === 0 ? 'selected' : ''}" data-format="${target}" role="radio" aria-checked="${index === 0}"><span class="format-icon" aria-hidden="true">${target.toUpperCase()}</span><span>.${target.toUpperCase()}</span></button>`).join('');
        options.classList.toggle('hidden', !targets.length);
        options.classList.toggle('flex', Boolean(targets.length));
        status.textContent = targets.length ? `${files.length} ${translations[language].ready}` : translations[language].unsupported;
      } catch (error) {
        status.textContent = 'Could not check this file. Is the server still running?';
      }
    }

    formatOptions.addEventListener('click', event => {
      const button = event.target.closest('[data-format]');
      if (!button) return;
      selectedTarget = button.dataset.format;
      formatOptions.querySelectorAll('[data-format]').forEach(option => {
        const isSelected = option === button;
        option.classList.toggle('selected', isSelected);
        option.classList.toggle('border-[#e75c35]', isSelected);
        option.classList.toggle('bg-[#fff2ed]', isSelected);
        option.classList.toggle('text-[#c94824]', isSelected);
        option.setAttribute('aria-checked', isSelected);
      });
    });

    document.querySelector('#converter-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!selectedFiles.length || !selectedTarget) return;
      convertButton.disabled = true; convertButton.textContent = `${translations[language].converting}...`; status.textContent = `${translations[language].converting}...`;
      try {
        const body = new FormData();
        const endpoint = selectedFiles.length === 1 ? '/api/convert' : '/api/batch-convert';
        const fieldName = selectedFiles.length === 1 ? 'upload' : 'uploads';
        selectedFiles.forEach(file => body.append(fieldName, file));
        body.append('target_format', selectedTarget);
        status.textContent = selectedFiles.length === 1 ? 'Converting your file...' : `Converting ${selectedFiles.length} files into a ZIP...`;
        const response = await fetch(`${API_URL}${endpoint}`, { method: 'POST', body });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || 'Conversion failed.');
        }
        const blob = await response.blob(); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = response.headers.get('content-disposition')?.split('filename=')[1]?.replaceAll('"', '') || (selectedFiles.length === 1 ? `converted.${selectedTarget}` : 'allverter-results.zip'); link.click(); URL.revokeObjectURL(link.href);
        status.textContent = selectedFiles.length === 1 ? translations[language].done : `${translations[language].done} (${selectedFiles.length})`;
      } catch (error) {
        status.textContent = error.message || 'Could not connect to the converter.';
      } finally {
        convertButton.disabled = false; convertButton.textContent = translations[language].convertFiles;
      }
    });

    function resetForm() {
      selectedFiles = []; selectedTarget = ''; input.value = ''; formatOptions.innerHTML = '';
      previewImage.removeAttribute('src'); previewImage.classList.add('hidden');
      fileName.textContent = ''; fileSize.textContent = ''; fileSummary.classList.add('hidden'); fileSummary.classList.remove('flex');
      options.classList.add('hidden'); options.classList.remove('flex'); status.textContent = translations[language].chooseFile;
    }
  </script>
</body>
</html>
